[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarviscore-personal-finance"
version = "0.1.0"
description = "JarvisCore for Personal Finance: a private money desk for M-Pesa and bank statements, built on jarviscore-framework."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # pinned to the current release so every gotcha we file reproduces on a known version
    "jarviscore-framework[redis]==2.1.0",
    # opens password-protected statements without system tools
    "pdfplumber>=0.11",
    # Jev decision models, the categoriser's judgement step
    "typesafe-sdk>=0.7",
    "pyyaml",
    "pydantic>=2",
    "python-dotenv",
    "truststore",
    # the desk in a browser
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15",
    "httpx>=0.27",
]

[project.scripts]
pf = "personal_finance.cli:main"
pf-desk = "personal_finance.web:serve"
pf-demo = "personal_finance.demo:main"

[tool.setuptools.packages.find]
include = ["personal_finance*"]

[tool.setuptools.package-data]
personal_finance = ["layouts/*.yaml", "profiles/*.yaml", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
